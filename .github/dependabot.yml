version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      maintenance:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/contrib/argocd-mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      maintenance:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      maintenance:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      maintenance:
        update-types:
          - "minor"
          - "patch"
