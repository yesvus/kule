name: container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR (main only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both architectures; publish on main only
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Publish the minimal single-host artifact. The original Dockerfile
          # remains available for explicitly opted-in legacy deployments.
          file: Dockerfile.single-host
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/yesvus/kule:sha-${{ github.sha }}
      - name: Report immutable digest for GitOps promotion
        if: github.event_name == 'push'
        run: echo "OCI_INDEX_DIGEST=${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
