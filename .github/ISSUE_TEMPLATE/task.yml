name: Maintenance or RFC
description: Track documentation, maintenance work, or a design discussion.
labels: ["maintenance", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, private host details, or vulnerability reproductions. Report security vulnerabilities privately through https://github.com/yesvus/kule/security/advisories/new.
  - type: dropdown
    id: area
    attributes:
      label: Component
      options:
        - Authentication
        - Host execution
        - Transport
        - Audit and authorization
        - CI and packaging
        - Repository maintenance
        - Documentation
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Context and goal
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope or open questions
      description: Keep an RFC exploratory; state decisions separately from questions.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Completion criteria
      description: Define evidence needed before closing this issue.
    validations:
      required: true
  - type: dropdown
    id: host_effects
    attributes:
      label: Expected host-side effect
      options:
        - Read-only observation
        - Changes host state
        - Both
        - Not applicable or unknown
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Required caller role
      placeholder: "operator, developer, not applicable, or unknown"
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: Security or privilege changes expected?
      options:
        - "No"
        - "Yes"
        - Unknown
    validations:
      required: true
