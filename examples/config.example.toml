# Minimal configuration for a development Kule server.
# Replace the example URLs and client ID with your OIDC provider's values.
# Secrets are supplied via KULE_OIDC_CLIENT_SECRET and KULE_JWT_SIGNING_KEY.

[server]
host = "127.0.0.1"
port = 8795
public_url = "https://mcp.example.com"
state_dir = "./.local/state"

[auth]
oidc_config_url = "https://id.example.com/.well-known/openid-configuration"
client_id = "kule"
required_group = "kule-users"
exec_group = "kule-exec"
groups_claim = "groups"

[audit]
path = "./.local/audit.jsonl"

[tools]
scratch_dir = "./.local/scratch"
exec_enabled = false
timeout_seconds = 30
max_output_bytes = 65536
