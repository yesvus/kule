# Minimal configuration for a development Kule server.
# Replace the example URLs and client ID with your OIDC provider's values.
# Secrets are supplied via KULE_OIDC_CLIENT_SECRET and KULE_JWT_SIGNING_KEY.

[server]
host = "127.0.0.1"
port = 8795
public_url = "https://mcp.example.com"
state_dir = "./.local/state"

[auth]
oidc_config_url = "https://id.example.com/.well-known/openid-configuration"
client_id = "kule"
required_group = "kule-users"
exec_group = "kule-exec"
groups_claim = "groups"

[audit]
path = "./.local/audit.jsonl"

[tools]
scratch_dir = "./.local/scratch"
exec_enabled = false
timeout_seconds = 30
max_output_bytes = 65536

# -----------------------------------------------------------------------------
# Multi-host SSH inventory (optional)
# -----------------------------------------------------------------------------
# When one or more [[hosts]] entries are defined, Kule registers multi-host
# tools (host_list, host_status, host_exec) instead of single-host fixed target exec.
#
# Multi-host execution security:
# - tools.exec_enabled defaults to false.
# - Each host policy also has exec_enabled = false by default.
# - Both server-level tools.exec_enabled = true AND per-host policy.exec_enabled = true
#   are required for host_exec to be enabled on a host.
# - Group authorization is checked per host:
#   * read_groups: IdP groups authorized to see and check status of the host.
#   * exec_groups: IdP groups authorized to execute scripts on the host.
# - SSH private keys must be private (chmod 0600, not group- or world-readable).

# Example: macOS workstation (zombie)
# [[hosts]]
# host_id = "zombie"
# transport = "ssh"
# platform = "macos"
# description = "macOS workstation"
# [hosts.ssh]
# host = "zombie.local"
# user = "operator"
# port = 22
# key_path = "/var/run/kule-host-ssh/zombie_id_ed25519"
# known_hosts_path = "/var/run/kule-host-ssh/known_hosts"
# [hosts.policy]
# read_groups = ["kule-users"]
# exec_groups = ["kule-exec"]
# exec_enabled = false  # exec disabled by default; per-host opt-in required

# Example: Linux server (gurbet)
# [[hosts]]
# host_id = "gurbet"
# transport = "ssh"
# platform = "linux"
# description = "Linux production server"
# [hosts.ssh]
# host = "gurbet.internal"
# user = "kule"
# port = 22
# key_path = "/var/run/kule-host-ssh/gurbet_id_ed25519"
# known_hosts_path = "/var/run/kule-host-ssh/known_hosts"
# [hosts.policy]
# read_groups = ["kule-users", "linux-operators"]
# exec_groups = ["kule-exec"]
# exec_enabled = false  # exec disabled by default; per-host opt-in required

