[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kule"
version = "0.1.0.dev0"
description = "Small self-hosted MCP server for authorized host management, with OIDC login, group-based authorization and an audit log."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.2.5",
    "httpx2>=2.16,<3",
    # Imported directly by the middleware; also a fastmcp dependency.
    "mcp-types>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    # ASGI test client used by tests/test_http_auth.py; also an mcp dependency.
    "httpx2>=2.16",
]

[project.scripts]
kule = "kule.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kule"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
